aid: vallor
name: Vallor
description: >-
  Vallor (Board AI, Inc.) is an AI coworker for procurement, legal, and sales
  teams that puts contracts on autopilot. Val reads every contract across the
  existing stack, drafts redlines against a playbook, flags risks, monitors
  obligations, renewals, SLAs, and rebates against live ERP and AP data, and
  answers plain-English questions with citations back to the source clause.
  It connects to 1,000+ systems including SAP, NetSuite, Snowflake, Salesforce,
  Ironclad, Icertis, DocuSign, and Slack, and ships a first-party Claude Code /
  Cowork plugin marketplace with 32 agent skills and 9 background agents for
  contract management and strategic sourcing. SOC 2 Type II audited and GDPR
  compliant, with customer data staying in the customer tenant. Backed by
  Bloomberg Beta.
